spring:
  application:
    name: order-service  # 微服务名称，注册到 Nacos

  cloud:
    nacos:
      # 服务注册与发现
      discovery:
        server-addr: 127.0.0.1:8848  # Nacos Server 地址
        namespace: dev               # 命名空间（环境隔离）
        group: DEFAULT_GROUP

      # 配置中心
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        file-extension: yaml         # 配置文件格式
        # 配置文件名: ${spring.application.name}-${spring.profiles.active}.${file-extension}
        # 即: order-service-dev.yaml

    # Sentinel 熔断限流配置
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080  # Sentinel 控制台地址
        port: 8719                   # 与控制台通信的端口
      eager: true                    # 提前初始化，不等到第一次调用

  # Seata 分布式事务
  # 在 spring-cloud-starter-alibaba-seata 中配置如下
  # seata:
  #   enabled: true
  #   application-id: ${spring.application.name}
  #   tx-service-group: order-service-tx-group  # 事务组名（与 Seata Server 配置一致）
  #   service:
  #     vgroup-mapping:
  #       order-service-tx-group: default       # 映射到 Seata Server 的集群名

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.javademo: DEBUG
    io.seata: INFO

---
# Sentinel 流控规则（也可在 Sentinel Dashboard 动态配置）
# 以下规则会被 Sentinel 加载
# spring.cloud.sentinel.datasource.ds1.file.file=classpath:sentinel-rules.json
