spring:
  application:
    name: java-fullstack-framework-demo

  # H2 内存数据库（演示用）
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # MyBatis-Plus 配置
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

# JWT 配置
jwt:
  # 生产环境：从配置中心读取，不要硬编码
  secret: JavaFullStackDemoSecretKey2024ForHS256Algorithm
  expiration-ms: 3600000  # 1小时

# 自定义 Starter 配置演示
hello:
  enabled: true
  name: "Java全栈开发者"
  greeting: "你好"

server:
  port: 8080

logging:
  level:
    com.javademo: DEBUG
    org.springframework.security: WARN
